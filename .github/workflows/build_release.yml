name: Verify mobile apps

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Test scheduling, fetching, settings, and widgets
        run: flutter test
      - name: Restore stable preview signing key
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          ATHAN_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ATHAN_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ATHAN_PREVIEW_KEYSTORE_BASE64" ]; then
            echo "::error::Configure ATHAN_PREVIEW_KEYSTORE_BASE64 for upgradeable preview APKs."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$ATHAN_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - name: Build Android preview APK
        run: flutter build apk --release
      - name: Verify preview signing certificate
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          signature_report="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          printf '%s\n' "$signature_report"
          actual="$(printf '%s\n' "$signature_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$actual" = 'f7f52594422cf2ce808e9510ed91ee27e42ff7efd2e9fee841d29a05a0441678'
      - name: Save installable preview
        uses: actions/upload-artifact@v4
        with:
          name: athan-android-${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'preview' || 'test' }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      # GitHub refuses files over 100 MB and the all-devices APK is larger, so the
      # copy kept at the repository root is the 64-bit ARM build used by phones.
      - name: Build the phone APK kept on main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          signature_report="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")"
          actual="$(printf '%s\n' "$signature_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$actual" = 'f7f52594422cf2ce808e9510ed91ee27e42ff7efd2e9fee841d29a05a0441678'
          size="$(stat -c %s "$apk")"
          echo "Phone APK: $size bytes"
          if [ "$size" -ge 99000000 ]; then
            echo "::error::The phone APK is $size bytes; GitHub rejects files of 100 MB or more."
            exit 1
          fi
      - name: Save the phone APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: athan-android-phone-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS simulator app (no signing)
        run: flutter build ios --simulator --debug --no-codesign
      - name: Launch iPhone app and verify startup
        timeout-minutes: 10
        run: bash tools/ios_smoke.sh
      - name: Save iPhone startup screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athan-iphone-startup-${{ github.sha }}
          path: build/review/ios-launch.png
          if-no-files-found: ignore
          retention-days: 14

  # Keeps one installable file at the repository root: AthanApp.apk on main is
  # always the phone build of the commit before it, signed with the trusted preview key.
  # Only this small job can write to the repository; it runs no build tooling.
  publish-apk:
    name: Keep the signed APK on main
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch the verified preview APK
        uses: actions/download-artifact@v4
        with:
          name: athan-android-phone-${{ github.sha }}
          path: ${{ runner.temp }}/apk
      - name: Commit AthanApp.apk to the repository root
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on; the newer run publishes its own APK."
            exit 0
          fi
          cp "$RUNNER_TEMP/apk/app-arm64-v8a-release.apk" AthanApp.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f AthanApp.apk
          if git diff --cached --quiet; then
            echo "AthanApp.apk already matches this build."
            exit 0
          fi
          git commit -m "Update AthanApp.apk to ${GITHUB_SHA::7} [skip ci]"
          if ! git push origin HEAD:main; then
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
              echo "::notice::main moved during publishing; the newer run publishes its own APK."
              exit 0
            fi
            exit 1
          fi

# Trusted Android previews use a stable private debug key. Production signing and
# store publishing are separate deliberate steps; this workflow never overwrites v2.0.0.

