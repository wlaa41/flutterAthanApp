name: Verify mobile apps

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      # 17 builds the app (the last one listed is the default). Robolectric needs
      # 21 to run Android 14 and later, so the native tests use that.
      - name: Set up Java 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Test scheduling, fetching, settings, and widgets
        run: flutter test
      # The native path from alarm to sound, on Android 9, 14 and 16 (Robolectric).
      # It runs before the signing key is restored, so it cannot touch the key.
      - name: Test that the athan plays, vibrates on silent and survives refreshes
        run: |
          flutter build apk --config-only
          cd android && JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Restore stable preview signing key
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          ATHAN_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ATHAN_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ATHAN_PREVIEW_KEYSTORE_BASE64" ]; then
            echo "::error::Configure ATHAN_PREVIEW_KEYSTORE_BASE64 for upgradeable preview APKs."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$ATHAN_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      # One build only: a second Gradle run in the same job signs with a freshly
      # generated key. It targets 64-bit ARM, which is what phones use; the APK for
      # every processor type is over GitHub's 100 MB file limit.
      - name: Build Android preview APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify preview signing certificate
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          signature_report="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$signature_report"
          actual="$(printf '%s\n' "$signature_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          if [ "$actual" != 'f7f52594422cf2ce808e9510ed91ee27e42ff7efd2e9fee841d29a05a0441678' ]; then
            echo "::error::Unexpected signing certificate: $actual"
            exit 1
          fi
          size="$(stat -c %s "$apk")"
          echo "APK: $size bytes"
          if [ "$size" -ge 99000000 ]; then
            echo "::error::The APK is $size bytes; GitHub rejects files of 100 MB or more."
            exit 1
          fi
      - name: Save installable preview
        uses: actions/upload-artifact@v4
        with:
          name: athan-android-${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'preview' || 'test' }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 70
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS simulator app (no signing)
        if: github.event_name != 'workflow_dispatch'
        run: flutter build ios --simulator --debug --no-codesign
      - name: Launch iPhone app and verify startup
        if: github.event_name != 'workflow_dispatch'
        timeout-minutes: 10
        run: bash tools/ios_smoke.sh
      - name: Save iPhone startup screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athan-iphone-startup-${{ github.sha }}
          path: build/review/ios-launch.png
          if-no-files-found: ignore
          retention-days: 14
      # When this workflow is started by hand, the two steps above give way to
      # a longer check: it builds the app, starts it, and rings two athan
      # alarms on the simulator (iOS 26), one with the phone in use and one
      # with it locked, keeping a video, pictures and the logs. A simulator
      # shows less than a phone, so this reports and never fails the run.
      - name: Ring two test alarms on the simulator
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 45
        continue-on-error: true
        run: bash tools/ios_alarm_check.sh
      - name: Save the alarm check
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: athan-iphone-alarm-check-${{ github.sha }}
          path: build/review/alarm
          if-no-files-found: ignore
          retention-days: 14

  # An unsigned iPhone build, AthanApp.ipa, for sideloading: Sideloadly or
  # AltStore signs it on the owner's computer with a free Apple ID, and it runs
  # for 7 days per signing. TestFlight and the App Store need the paid Apple
  # Developer Program; that is a separate deliberate step.
  ios-device:
    name: Build the iPhone app (unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # iOS takes a plain x.y.z version; the -rc part stays in the Android build.
      - name: Build the iPhone app without signing
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          name="${version%%+*}"
          flutter build ios --release --no-codesign \
            --build-name="${name%%-*}" --build-number="${version##*+}"
      - name: Package AthanApp.ipa
        run: |
          set -euo pipefail
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry AthanApp.ipa Payload)
          plist=build/ipa/Payload/Runner.app/Info.plist
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")"
          done
          echo "IPA: $(stat -f %z build/ipa/AthanApp.ipa) bytes"
      # The athan alarm (iOS 26) needs three things inside the app: the
      # extension that draws it, with the app's own version and an identifier
      # under the app's; the permission text; and each excerpt at the top of
      # the bundle, where AlarmKit looks for a named sound.
      - name: Check the athan alarm is in the app
        run: |
          set -euo pipefail
          xcodebuild -version
          app=build/ipa/Payload/Runner.app
          extension="$app/PlugIns/AthanAlarm.appex"
          read_key() { /usr/libexec/PlistBuddy -c "Print :$2" "$1/Info.plist"; }
          test -x "$extension/AthanAlarm"
          app_id="$(read_key "$app" CFBundleIdentifier)"
          extension_id="$(read_key "$extension" CFBundleIdentifier)"
          echo "Extension: $extension_id $(read_key "$extension" CFBundleShortVersionString) ($(read_key "$extension" CFBundleVersion)), iOS $(read_key "$extension" MinimumOSVersion)"
          case "$extension_id" in "$app_id".*) ;; *) echo "::error::The extension identifier must start with $app_id."; exit 1 ;; esac
          for key in CFBundleShortVersionString CFBundleVersion; do
            if [ "$(read_key "$app" "$key")" != "$(read_key "$extension" "$key")" ]; then
              echo "::error::$key differs between the app and its extension."
              exit 1
            fi
          done
          [ "$(read_key "$extension" NSExtension:NSExtensionPointIdentifier)" = com.apple.widgetkit-extension ]
          read_key "$app" NSAlarmKitUsageDescription
          [ "$(read_key "$app" NSSupportsLiveActivities)" = true ]
          sounds=0
          for sound in asset/*_short.wav; do
            cmp -s "$sound" "$app/$(basename "$sound")" || { echo "::error::$(basename "$sound") is not in the app bundle. Run tools/add_ios_alarm_target.rb."; exit 1; }
            sounds=$((sounds + 1))
          done
          echo "Alarm sounds in the bundle: $sounds"
          # The Live Activity buttons are App Intents; iOS finds them through this.
          ls "$app/Metadata.appintents" "$extension/Metadata.appintents"
      - name: Save the iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: athan-iphone-unsigned-${{ github.sha }}
          path: build/ipa/AthanApp.ipa
          if-no-files-found: error
          retention-days: 14

  # Keeps one installable file at the repository root: AthanApp.apk on main is
  # always the build of the commit before it, signed with the trusted preview key.
  # Only this small job can write to the repository; it runs no build tooling.
  publish-apk:
    name: Keep the signed APK on main
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch the verified preview APK
        uses: actions/download-artifact@v4
        with:
          name: athan-android-preview-${{ github.sha }}
          path: ${{ runner.temp }}/apk
      - name: Commit AthanApp.apk to the repository root
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on; the newer run publishes its own APK."
            exit 0
          fi
          cp "$RUNNER_TEMP/apk/app-release.apk" AthanApp.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f AthanApp.apk
          if git diff --cached --quiet; then
            echo "AthanApp.apk already matches this build."
            exit 0
          fi
          git commit -m "Update AthanApp.apk to ${GITHUB_SHA::7} [skip ci]"
          if ! git push origin HEAD:main; then
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
              echo "::notice::main moved during publishing; the newer run publishes its own APK."
              exit 0
            fi
            exit 1
          fi

  # Keeps the newest iPhone build as a download: AthanApp.ipa on the
  # "iPhone app" pre-release, tag ios-latest. Like publish-apk, this small job
  # is the only one that writes, and it runs no build tooling.
  publish-ipa:
    name: Keep the iPhone app as a download
    needs: ios-device
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the iPhone app
        uses: actions/download-artifact@v4
        with:
          name: athan-iphone-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/ipa
      - name: Attach AthanApp.ipa to the iPhone app release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # main may already carry publish-apk's commit on top of this one.
          read -r head parent < <(gh api "repos/$GH_REPO/commits/main" --jq '.sha + " " + .parents[0].sha')
          if [ "$head" != "$GITHUB_SHA" ] && [ "$parent" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved on; the newer run publishes its own iPhone app."
            exit 0
          fi
          notes="Unsigned iPhone build of ${GITHUB_SHA::7}. Sign and install it with a free Apple ID using Sideloadly (Windows or Mac); it runs for 7 days per signing. Steps are in the README."
          if ! gh release view ios-latest >/dev/null 2>&1; then
            gh release create ios-latest --prerelease --target "$GITHUB_SHA" \
              --title "iPhone app (unsigned, for sideloading)" --notes "$notes"
          fi
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/ios-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload ios-latest "$RUNNER_TEMP/ipa/AthanApp.ipa" --clobber
          gh release edit ios-latest --notes "$notes"

# Trusted Android previews use a stable private debug key. Production signing and
# store publishing are separate deliberate steps; this workflow never overwrites v2.0.0.

