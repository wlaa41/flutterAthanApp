name: Verify mobile apps

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Test scheduling, fetching, settings, and widgets
        run: flutter test
      - name: Build Android preview APK
        run: flutter build apk --release
      - name: Save installable preview
        uses: actions/upload-artifact@v4
        with:
          name: athan-android-preview-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS simulator app (no signing)
        run: flutter build ios --simulator --debug --no-codesign
      - name: Launch iPhone app and verify startup
        timeout-minutes: 5
        run: bash tools/ios_smoke.sh
      - name: Save iPhone startup screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: athan-iphone-startup-${{ github.sha }}
          path: build/review/ios-launch.png
          if-no-files-found: ignore
          retention-days: 14

# Android previews use the project's debug signing key. Production signing and
# publishing are separate deliberate steps; this workflow never overwrites v2.0.0.

