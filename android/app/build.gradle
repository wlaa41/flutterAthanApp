plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "wlaa41.github.io.flutter_pro"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    // The alarm path runs on Robolectric: the Android framework on the JVM.
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    defaultConfig {
        applicationId "wlaa41.github.io.flutter_pro"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        // Flutter builds its own libraries for the processors named by
        // --target-platform, but a plugin's ready-made libraries (the speech
        // runtime of the Al-Kahf Journey) come along for every processor
        // unless they are filtered the same way. Left unfiltered they add
        // 21 MB to the 64-bit ARM APK that CI keeps in the repository.
        def flutterAbis = [
            'android-arm'  : 'armeabi-v7a',
            'android-arm64': 'arm64-v8a',
            'android-x64'  : 'x86_64',
        ]
        def targetAbis = (project.findProperty('target-platform') ?: '')
            .toString().tokenize(',').collect { flutterAbis[it] }.findAll { it != null }
        def splitPerAbi = (project.findProperty('split-per-abi') ?: 'false').toString().toBoolean()
        if (!targetAbis.isEmpty() && !splitPerAbi) {
            ndk {
                abiFilters.clear()
                abiFilters.addAll(targetAbis)
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    // The APK is kept at the root of the repository, and GitHub takes no file
    // of 100 MB or more. Native libraries are stored compressed so it fits:
    // the Flutter engine, the app, and the speech runtime that hears a
    // recitation in the Al-Kahf Journey (27 MB before compression).
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // Geofence and location for "Beep away from home".
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'androidx.test:core:1.6.1'
}
