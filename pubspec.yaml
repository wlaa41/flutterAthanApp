name: flutter_pro
description: Prayer times, Athan and Iqama reminders, and a Quran reader with several riwayat.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion. android:
# Read more about iOS versioning a
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.2.0-rc.10+20

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  just_audio: ^0.9.36
  flutter_local_notifications: ^17.0.0
  http: ^0.13.6
  # Checks an added athan against the checksum recorded in the catalogue.
  crypto: ^3.0.6
  path_provider: ^2.1.2
  # 2.3.1's older generated bindings are incompatible with JNI 1.2 class lookup.
  # Keep private audio storage and just_audio's asset cache on the channel API.
  path_provider_android: 2.2.23
  rxdart: ^0.27.7
  shared_preferences: ^2.2.2
  timezone: ^0.9.4
  adhan_dart: ^2.0.1
  file_picker: ^13.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:


  uses-material-design: true

#   To add assets to your application, add an assets section, like this:
  assets:
    - asset/
    # The Quran text of each mushaf, built by tools/build_quran_assets.py.
    - asset/quran/

  # One font per mushaf: the King Fahd Complex draws each riwayah with its own
  # font, and a text only reads correctly in the font it was written for.
  fonts:
    - family: kfgqpc_hafs
      fonts:
        - asset: asset/fonts/kfgqpc_hafs.ttf
    - family: kfgqpc_shouba
      fonts:
        - asset: asset/fonts/kfgqpc_shouba.ttf
    - family: kfgqpc_warsh
      fonts:
        - asset: asset/fonts/kfgqpc_warsh.ttf
    - family: kfgqpc_qaloon
      fonts:
        - asset: asset/fonts/kfgqpc_qaloon.ttf
    - family: kfgqpc_doori
      fonts:
        - asset: asset/fonts/kfgqpc_doori.ttf
    - family: kfgqpc_soosi
      fonts:
        - asset: asset/fonts/kfgqpc_soosi.ttf
    - family: kfgqpc_bazzi
      fonts:
        - asset: asset/fonts/kfgqpc_bazzi.ttf
    - family: kfgqpc_qumbul
      fonts:
        - asset: asset/fonts/kfgqpc_qumbul.ttf
